[project]
name = "citewise"
version = "0.1.0"
description = "Open-source AI-search visibility platform: measure how answer engines talk about your brand."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.13",
    "anthropic>=0.40",
    "apscheduler>=3.10,<4",
    "fastapi>=0.115",
    "google-genai>=1.0",
    "httpx>=0.27",
    "jinja2>=3.1",
    "numpy>=1.26",
    "openai>=1.50",
    "psycopg[binary]>=3.2",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "pyyaml>=6.0",
    "rich>=13",
    "scikit-learn>=1.5",
    "sqlalchemy>=2.0.30",
    "typer>=0.12",
    "uvicorn[standard]>=0.30",
]

[project.scripts]
citewise = "citewise.cli:app"

[dependency-groups]
dev = [
    "matplotlib>=3.8",
    "mypy>=1.11",
    "pre-commit>=3.8",
    "pytest>=8.3",
    "ruff>=0.6",
    "types-pyyaml>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/citewise"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["web"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = ["B008"]  # FastAPI/Typer use calls in defaults by design

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
check_untyped_defs = false
warn_unused_ignores = false
files = ["src/citewise"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
