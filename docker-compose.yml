services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: citewise
      POSTGRES_PASSWORD: citewise
      POSTGRES_DB: citewise
    ports:
      - "${CITEWISE_DB_PORT:-5432}:5432"  # override if 5432 is taken
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U citewise -d citewise"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      CITEWISE_MODE: ${CITEWISE_MODE:-mock}
      DATABASE_URL: postgresql+psycopg://citewise:citewise@db:5432/citewise
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    # Apply migrations, then serve. Seed with: docker compose exec api citewise seed
    command: ["sh", "-c", "alembic upgrade head && uvicorn citewise.api.main:app --host 0.0.0.0 --port 8000"]
    ports:
      - "${CITEWISE_API_PORT:-8000}:8000"

volumes:
  pgdata:
