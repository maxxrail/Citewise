    description: Free trials, coupons, promo codes and startup or nonprofit discounts.
    keywords: [free trial, trial, discount, promo code, coupon, startup discount, nonprofit, deal, cheapest, cheap]
  - label: Integrations and API
    description: Connecting the tool to GitHub, Slack, GitLab and custom code.
    keywords: [github, gitlab, slack, integration, integrate, api, webhooks, pull requests]
  - label: Migration from other tools
    description: Moving projects and history off Jira, Trello or spreadsheets.
    keywords: [migrate, migration, jira import, replace jira, jira alternative, switch, spreadsheets, ticket history]
  - label: Client and agency workflows
    description: "Running client work: portals, approvals, guest access and retainers."
    keywords: [client, clients, agency, agencies, client portal, approvals, guest access, retainer, freelancers]
  - label: Sprint and agile planning
    description: Sprints, backlogs, story points, scrum and kanban for dev teams.
    keywords: [sprint, sprints, backlog, scrum, kanban, story point, agile, epics, retro, issue tracker, bugs, dev team, tech debt]
  - label: Time tracking and billing
    description: Tracking billable hours, timesheets and invoicing.
    keywords: [time tracking, billable hours, invoicing, timesheets, profitability]
  - label: Reporting and engineering metrics
    description: Dashboards, burndown charts, velocity and status reports.
    keywords: [burndown, velocity, cycle time, metrics, status report, dashboard, report]
  - label: Security and permissions
    description: SSO, SOC 2, permissions, self-hosting and data safety.
    keywords: [sso, soc 2, permissions, self hosted, self-hosted, security, safe, compliant, uptime]
  - label: Brand reputation and reviews
    description: Whether Taskflow is legit, who owns it, and what reviews say.
    keywords: [legit, reviews, review, reddit, g2, capterra, who owns, login, help center, status page, case studies]
  - label: Small team setup
    description: "Getting a small startup team organized: onboarding, templates and planning rituals."
    keywords: [small team, startup, startups, founders, onboard, templates, standups, planning meeting, okrs, remote team, recurring tasks]
  - label: Roadmaps and timelines
    description: Gantt charts, roadmaps, dependencies and resource planning.
    keywords: [gantt, roadmap, roadmaps, timeline, timelines, dependencies, resource planning, workload, capacity]
