name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      CITEWISE_MODE: mock
      # The metrics SQL tests also run against real Postgres (they skip without this).
      CITEWISE_TEST_PG_URL: postgresql+psycopg://citewise:citewise@localhost:5432/citewise_test
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: citewise
          POSTGRES_PASSWORD: citewise
          POSTGRES_DB: citewise_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U citewise" --health-interval 5s --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - run: uv run pytest -q
      # Enabled in Module 6: blocks merges when eval scores regress
      # - run: uv run citewise eval run --suite all --mode mock --fail-under evals/baselines/baseline.json

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t citewise:ci .
