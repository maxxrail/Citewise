name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      CITEWISE_MODE: mock
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest -q
      # Enabled in Module 6: blocks merges when eval scores regress
      # - run: uv run citewise eval run --suite all --mode mock --fail-under evals/baselines/baseline.json
